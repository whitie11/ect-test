<nav class="relative bg-gray-800">
  <div class="mx-auto max-w-7xl px-2 md:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">

      <div class=" inset-y-0 left-0 flex items-center md:hidden">
        <!-- Mobile menu button-->
        <button type="button" command="--toggle" commandfor="mobile-menu" (click)="toggleMenu()"
          class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/5 hover:text-white focus:outline-2 focus:-outline-offset-1 focus:outline-indigo-500">
          <span class="absolute -inset-0.5"></span>
          <span class="sr-only">Open main menu</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon"
            aria-hidden="true" class="size-6 in-aria-expanded:hidden">
            <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon"
            aria-hidden="true" class="size-6 not-in-aria-expanded:hidden">
            <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      
      <div class="flex flex-1 items-center justify-center md:items-stretch md:justify-start">
        
        <div class="flex shrink-0 items-center">
          <img src="logo.jpg" alt="Your Company" class="h-8 w-auto" />
          <h1 class="text-white font-bold text-lg ml-2">ECT Pathway</h1>
        </div>

        <div class="hidden md:ml-6 md:block">
          <div class="flex space-x-2">
            <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-white/5 hover:text-white" -->
            <a routerLink="/home/about" aria-current="page"
              class="rounded-md px-3 py-2  font-medium text-gray-300 hover:bg-white/5 hover:text-white">About</a>
            
              <a id="referral-link" (click)="showRefMenu()"
              class="rounded-md px-3 py-2  font-medium text-gray-300 hover:bg-white/5 hover:text-white">Referrals</a>
            
              <a id="clinic-link" (click)="showClinicMenu()"
              class="rounded-md px-3 py-2 font-medium text-gray-300 hover:bg-white/5 hover:text-white">Clinics</a>
            
              <a routerLink="/home/reports"
              class="rounded-md px-3 py-2  font-medium text-gray-300 hover:bg-white/5 hover:text-white">Reports</a>
            
              <a routerLink="/home/admin"
              class="rounded-md px-3 py-2  font-medium text-gray-300 hover:bg-white/5 hover:text-white">Admin</a>

          </div>
        </div>

      </div>
      <h1 class="text-white font-bold px-1.5">{{ (isLoggedIn$ | async)?.state ? (isLoggedIn$ | async)?.username : '' }}</h1>
     
     @if ((isLoggedIn$ | async)?.state) {
      <button type="submit" (click)="logout()"
        class=" bg-blue-600 hover:bg-blue-700 text-white font-semibold p-2 rounded-lg transition">Logout</button>
     } @else {
      <button type="submit" (click)="login()"
        class=" bg-blue-600 hover:bg-blue-700 text-white font-semibold p-2 rounded-lg transition">Login</button>
     }  
   
   
   
      </div>



  </div>

</nav>

  <div id="mobile-menu"  class="md:hidden absolute rounded-b-md shadow-lg z-10 space-y-1 px-2 pt-2 pb-3 w-3/12  bg-gray-800" [ngClass]="isMenuOpen ? 'transition ease-out duration-300 transform opacity-100 scale-100' : 
  'transition ease-in duration-75 transform opacity-0 scale-95'">
   
      <!-- Current: "bg-gray-950/50 text-white", Default: "text-gray-300 hover:bg-white/5 hover:text-white" -->
      <a routerLink="/home/about" aria-current="page"
        class="block rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">About</a>
      <a routerLink="/home/referrals"
